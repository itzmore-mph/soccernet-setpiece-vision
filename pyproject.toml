[project]
name = "soccernet-setpiece-vision"
version = "1.0.0"
description = "Pitch Control from broadcast video for set-piece analysis using SoccerNet data"
requires-python = ">=3.11"
dependencies = [
    # Detection & tracking
    "ultralytics==8.3.107",
    "lap==0.5.13",
    # Deep learning
    "torch>=2.1.0",
    # Computer vision
    "opencv-python>=4.8.0",
    # Data & analysis
    "numpy>=1.26.0,<3.0",
    "pandas>=2.1.0",
    "pyarrow>=14.0.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    # Statistics
    "pingouin>=0.5.4",
    # Visualization
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "mplsoccer>=1.4.0",
    # StatsBomb data
    "statsbombpy>=1.14.0",
    # HuggingFace (Soccana weights download)
    "huggingface-hub>=0.20.0",
    # Jupyter (for notebooks)
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "ipykernel>=6.25.0",
    "ipywidgets>=8.1.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["ruff", "black", "hypothesis", "pytest"]

[tool.ruff]
line-length = 120

[tool.black]
line-length = 120
